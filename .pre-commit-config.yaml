repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: Mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false

      - id: architecture-boundaries
        name: Architecture boundaries
        entry: uv run python scripts/check_architecture_boundaries.py
        language: system
        pass_filenames: false
